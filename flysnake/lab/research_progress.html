<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>果蝇脑 · 学习验证进度</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#101822;color:#eef3fa}body{max-width:1160px;margin:0 auto;padding:38px 24px}h1{font-size:30px;margin:7px 0 15px}p{line-height:1.8;color:#b8c7d9}.eyebrow{letter-spacing:2px;font-size:12px;color:#63ddc2}.note{padding:18px 22px;border-left:3px solid #e6bf72;background:#1e2630;border-radius:7px;margin:24px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:18px}.card{background:#1b2635;border:1px solid #304056;border-radius:14px;padding:22px;overflow:hidden}.card h2{font-size:18px;margin:0 0 8px}.id{font-size:11px;color:#91a4bd;word-break:break-all}.pill{font-size:12px;padding:4px 9px;border-radius:20px;background:#34465a;float:right}.running{color:#75e4ce}.complete{color:#b4c4db}table{width:100%;border-collapse:collapse;margin:16px 0;font-size:13px}td,th{text-align:left;padding:9px 4px;border-bottom:1px solid #314155}th{color:#aabbd0;font-weight:400}strong{color:#75e4ce}small{color:#95a8c0;line-height:1.6;display:block}canvas{width:100%;height:96px;display:block;margin:15px 0 5px}#connection{font-size:12px;color:#9bb0c8}details{margin-top:15px}summary{font-size:12px;color:#9bb0c8;cursor:pointer}.path{font-size:11px;word-break:break-all;color:#95a8c0}a{color:#75e4ce}@media(max-width:450px){body{padding:24px 14px}.grid{grid-template-columns:1fr}}
</style>
<div class="eyebrow">MALE CNS · CONNECTOME LEARNING EXPERIMENTS</div>
<h1>果蝇脑的学习，正在逐项验证</h1>
<p>动作来自连接组模拟产生的脉冲。奖励用于修改已有突触；训练期的探索电流与学习规则属于公开的工程假设。旧游戏和旧记忆独立保留。</p>
<div class="note"><b>尚未完成：让贪吃蛇稳定学会吃食。</b><br><small>两选一成绩不等于贪吃蛇能力；权重变化不等于学会；训练曲线含探索噪声。重点查看关闭探索后的评估、全新画面、冻结与错配奖励对照。</small></div>
<p id="connection">正在读取已提交的结果…</p><div class="grid" id="runs"></div>
<script>
const e=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=x=>(100*x).toFixed(1)+'%';
const arm={learning:'正常奖惩学习',frozen:'冻结突触对照',shuffled:'错配奖惩对照'};
const phase={before:'训练前',initial:'初次训练后',reversal:'奖励反转后'};
const currentPhase={initial:'首次训练 / 评估',reversal:'奖励反转训练 / 评估'};
function title(r){if(r.arm)return arm[r.arm]+' · 正式验证';if(r.name.startsWith('online-native'))return'局部学习规则 · 贪吃蛇课程';if(r.name.startsWith('native-snake'))return'突触参数搜索 · 贪吃蛇';if(r.name.startsWith('node-perturbation'))return'局部学习规则 · 开发实验';return'多布局突触搜索 · 开发实验'}
function graph(canvas,points){const ctx=canvas.getContext('2d');canvas.width=660;canvas.height=150;ctx.strokeStyle='#405068';ctx.lineWidth=1;[.0,.5,1].forEach(y=>{ctx.beginPath();ctx.moveTo(35,125-105*y);ctx.lineTo(650,125-105*y);ctx.stroke()});ctx.fillStyle='#9cb0c8';ctx.font='15px sans-serif';ctx.fillText('100%',0,15);ctx.fillText('0%',5,143);if(!points.length)return;ctx.strokeStyle='#75e4ce';ctx.lineWidth=3;ctx.beginPath();points.forEach((p,i)=>{const x=40+(610*i/Math.max(1,points.length-1)),y=125-105*p.accuracy;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()}
async function update(){try{const response=await fetch('/api/progress',{cache:'no-store'});if(!response.ok)throw Error(response.status);const data=await response.json();data.runs.sort((a,b)=>Number(!!b.arm)-Number(!!a.arm)||a.name.localeCompare(b.name));document.querySelector('#connection').textContent='只读观察页 · '+new Date(data.time*1000).toLocaleTimeString()+' 更新 · 关闭页面不会向训练发送停止指令';const box=document.querySelector('#runs');box.innerHTML=data.runs.map((r,i)=>{let body='';if(Object.keys(r.evaluations).length){body+='<table><tr><th>冻结评估</th><th>同类画面</th><th>全新坐标</th></tr>';for(const [p,v]of Object.entries(r.evaluations))body+=`<tr><td>${e(phase[p]||p)}</td><td>${pct(v.familiar_distribution.accuracy)} (${v.familiar_distribution.correct}/${v.familiar_distribution.n})</td><td>${pct(v.novel_pixels.accuracy)} (${v.novel_pixels.correct}/${v.novel_pixels.n})</td></tr>`;body+='</table>'}if(r.development_test){let t=r.development_test;body+=`<p>开发评估 <strong>${pct(t.accuracy)}</strong>（${t.correct}/${t.n}）</p><small>${t.novelty_claim==='pixel_disjoint'?'测试画面与既往使用画面去重分离；仍需独立重复。':'未确立新画面泛化；可能包含训练中见过的画面。'}</small>`}if(Object.keys(r.food).length){const labels={before:'训练前',after:'训练后',training:'训练期',before_nearby_food:'训练前 · 近食物',after_nearby_food:'训练后 · 近食物',before_uniform_food:'训练前 · 任意食物',after_uniform_food:'训练后 · 任意食物'};body+='<table><tr><th>游戏条件</th><th>吃食总数 / 局数</th></tr>'+Object.entries(r.food).map(([k,v])=>`<tr><td>${e(labels[k]||k)}</td><td>${v.food} / ${v.n}</td></tr>`).join('')+'</table>'}if(r.curve.length)body+=`<canvas id="chart${i}"></canvas><small>训练期每 40 次的正确率（含探索）；不代表冻结评估结果。</small>`;return`<section class="card"><span class="pill ${r.status==='complete'?'complete':'running'}">${r.status==='complete'?'该实验已结束':'进行中'}</span><h2>${e(title(r))}</h2><div class="id">${e(r.name)}</div><p>已完成 <strong>${r.completed}</strong> 个记录${r.phase?' · '+e(currentPhase[r.phase]||r.phase):''}${r.memory_saved?' · 已保存 '+r.memory_saved+' 个边界存档':''}</p>${body}<details><summary>结果文件</summary><p class="path">${e(r.path)}</p></details></section>`}).join('');data.runs.forEach((r,i)=>{if(r.curve.length)graph(document.querySelector('#chart'+i),r.curve)})}catch(err){document.querySelector('#connection').textContent='暂时无法读取进度：'+err.message+'。此页面不控制训练进程。'}}update();setInterval(update,5000);
</script></html>
